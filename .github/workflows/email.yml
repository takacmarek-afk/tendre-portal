name: Email

# ══════════════════════════════════════════════════════════════════════════
#  STAV: ZAPNUTE NAOSTRO (17.9.2026). Beh je planovany kazdy pracovny den —
#  to neznamena, ze kazdy odberatel dostane mail kazdy den. `posli_email.py`
#  (funkcia pripraveny_na_dalsi, migracia 20_frekvencia_odberu.sql) posle
#  tyzdennemu odberatelovi dalsi mail najskor o 6 dni po predoslom; denny
#  odberatel je na rade vzdy, ked je nieco nove. Beh kazdy den teda len
#  umoznuje DENNU volbu fungovat — tyzdennych sa nedotkne.
#
#  AK BY SI NIEKEDY POTREBOVAL VYPNUT CELE POSIELANIE:
#  Zakomentuj `schedule:` blok nizsie (rovnako, ako bol predtym) — rucne
#  spustenie cez workflow_dispatch (s nasucho=true na test) funguje aj tak.
#
#  PRED PRVYM SPUSTENIM (uz hotove, pre buducu referenciu):
#  1. V Resend si vytvor API kluc (Dashboard -> API Keys -> Create).
#  2. Settings -> Secrets and variables -> Actions -> RESEND_API_KEY.
#  3. Test: workflow_dispatch s nasucho=true, potom nasucho=false
#     a komu=tvoj@email.sk, aby si videl skutocny e-mail v Outlooku.
# ══════════════════════════════════════════════════════════════════════════

on:
  workflow_dispatch:
    inputs:
      nasucho:
        description: "Nasucho — nic neposielat, len vypisat (nechaj true, kym si neistý)"
        type: boolean
        default: true
      komu:
        description: "Poslat len na tuto adresu (na test). Prazdne = vsetkym, komu prislo na rad."
        type: string
        default: ""

  # Kazdy pracovny den o 6:20 UTC (8:20 letny cas), hodinu po pipeline
  # (05:10 UTC) — nove prilezitosti z toho rana su uz v databaze. Ktori
  # odberatelia naozaj dostanu mail v ktory den, riadi pripraveny_na_dalsi()
  # v posli_email.py, nie tento cron.
  schedule:
    - cron: "20 6 * * 1-5"

permissions:
  contents: read

concurrency:
  group: email
  cancel-in-progress: false

jobs:
  posli:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - run: pip install -r pipeline/requirements.txt

      - name: Poslat email (podla frekvencie kazdeho odberatela)
        working-directory: pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          # Vstupy chodia cez premenne prostredia, NIE priamo do skriptu.
          # Povodne tu bolo `--komu ${{ inputs.komu }}`, cim sa obsah pola
          # vlepil do shellu — kto vie spustit workflow, mohol do toho pola
          # napisat prikaz a ten by sa vykonal. Spustit ho vies len ty,
          # takze to nebola dira do sveta, ale je to vzor, ktory sa
          # v CI nepise. Takto sa hodnota k shellu dostane ako DATA.
          EVENT: ${{ github.event_name }}
          NASUCHO: ${{ inputs.nasucho }}
          KOMU: ${{ inputs.komu }}
        run: |
          set -euo pipefail
          ARGS=()
          # Planovany beh posiela naozaj. Rucny beh sa riadi prepinacom.
          if [ "$EVENT" = "workflow_dispatch" ] && [ "$NASUCHO" = "true" ]; then
            ARGS+=(--nasucho)
          fi
          if [ -n "${KOMU:-}" ]; then
            ARGS+=(--komu "$KOMU")
          fi
          echo "Spustam: python posli_email.py ${ARGS[*]-}"
          python posli_email.py "${ARGS[@]}"
