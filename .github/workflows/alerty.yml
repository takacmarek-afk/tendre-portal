name: Sused uz stavia

# ══════════════════════════════════════════════════════════════════════════
#  STAV: PRIPRAVENE, ESTE NEZAPNUTE NAOSTRO — pred prvym ostrym behom over
#  workflow_dispatch s nasucho=true (over v logu pocet odberatelov, pocet
#  najdenych udalosti podla okresu a nahlad obsahu), potom nasucho=false
#  s --komu na vlastnu adresu (viz pipeline/alerty.py --komu). Az potom
#  odkomentuj `schedule:` nizsie.
#
#  CO TOTO ROBI
#  Mesacny FOMO alert pre obce z odber_obce (uz existujuci opt-in zoznam,
#  rovnaky ako pri tyzdennom Email workflow) — "obec vo vasom okrese
#  nedavno podpisala dotacnu zmluvu". Zdroj dat: subsidies (rovnake udaje
#  ako obce.aktivne_programy), zoznamovane podla okresu cez
#  pipeline/register_obci.py. Detaily a zamerne zjednodusenie (zatial len
#  okres, nie aj velkost obce) su v hlavicke pipeline/alerty.py.
#
#  PRECO SAMOSTATNY WORKFLOW, NIE SUCAST email.yml
#  Iny cyklus (mesacny, nie tyzdenny/denny) a vlastna deduplikacia
#  (sused_alerty_odoslane) — zlyhanie/zmena tu nesmie ovplyvnit uz funkcny
#  tyzdenny email. Rovnaky princip oddelenia ako ruz-financie.yml voci
#  pipeline.yml.
# ══════════════════════════════════════════════════════════════════════════

on:
  workflow_dispatch:
    inputs:
      nasucho:
        description: "Nasucho — nic neposielat, len vypisat (nechaj true, kym si neistý)"
        type: boolean
        default: true
      komu:
        description: "Poslat len na tuto adresu (test, nepovinne)"
        type: string
        default: ""

  # Raz mesacne, 1. den v mesiaci, mimo hlavneho pipeline behu aj RUZ behu.
  # schedule:
  #   - cron: "20 6 1 * *"

permissions:
  contents: read

concurrency:
  group: alerty
  cancel-in-progress: false

jobs:
  posli:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - run: pip install -r pipeline/requirements.txt

      - name: Poslat "Sused uz stavia" alerty
        working-directory: pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          # Rovnaky dovod ako v email.yml/pozvanky.yml: vstup ide cez
          # premennu prostredia, nie priamo interpolovany do shell prikazu.
          EVENT: ${{ github.event_name }}
          NASUCHO: ${{ inputs.nasucho }}
          KOMU: ${{ inputs.komu }}
        run: |
          set -euo pipefail
          ARGS=()
          if [ "$EVENT" = "workflow_dispatch" ] && [ "$NASUCHO" = "true" ]; then
            ARGS+=(--nasucho)
          fi
          if [ -n "$KOMU" ]; then
            ARGS+=(--komu "$KOMU")
          fi
          echo "Spustam: python alerty.py ${ARGS[*]-}"
          python alerty.py "${ARGS[@]}"
