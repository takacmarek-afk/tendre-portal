name: Bezplatny tyzdenny prehlad

# Tyzdenny e-mail s poctami a ukazkami organizaciam, ktorym skoncila skuska
# alebo zaplatene obdobie (najviac 8 tyzdnov po konci). Skript:
# pipeline/posli_bezplatny_email.py, RPC z migracie 76.
# PRED PUSHOM musi byt v Supabase spustena migracia 76_bezplatny_prehlad.sql.

on:
  workflow_dispatch:
    inputs:
      nasucho:
        description: "Nasucho — nic neposielat, len vypisat"
        type: boolean
        default: true
  schedule:
    - cron: "42 6 * * 1"

permissions:
  contents: read

concurrency:
  group: bezplatny-email
  cancel-in-progress: false

jobs:
  posli:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - run: pip install -r pipeline/requirements.txt

      - name: Poslat bezplatny prehlad
        working-directory: pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EVENT: ${{ github.event_name }}
          NASUCHO: ${{ inputs.nasucho }}
        run: |
          set -euo pipefail
          ARGS=()
          if [ "$EVENT" = "workflow_dispatch" ] && [ "$NASUCHO" = "true" ]; then
            ARGS+=(--nasucho)
          fi
          echo "Spustam: python posli_bezplatny_email.py ${ARGS[*]-}"
          python posli_bezplatny_email.py "${ARGS[@]}"
