name: Pipeline CRZ

on:
  schedule:
    # 05:10 UTC = 07:10 letny cas, pondelok az piatok
    - cron: "10 5 * * 1-5"
  workflow_dispatch:
    inputs:
      bootstrap:
        description: "Prvotne naplnenie databazy (spusta sa dokola, kym nedobehne)"
        type: boolean
        default: false
      budget:
        description: "Casovy rozpocet jedneho behu v minutach"
        type: string
        default: "300"
      chain:
        description: "Poradie behu v retazi. Nechaj 0, dopluje sa samo."
        type: string
        default: "0"

# actions: write je potrebne, aby si beh mohol zavolat pokracovanie sam.
# workflow_dispatch je jedina vynimka z ochrany proti nekonecnej slucke.
permissions:
  contents: read
  actions: write

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - run: pip install -r pipeline/requirements.txt

      - name: Spustit pipeline
        id: pipeline
        working-directory: pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TIME_BUDGET_MIN: ${{ inputs.budget || '45' }}
        run: |
          if [ "${{ inputs.bootstrap }}" = "true" ]; then
            python main.py --bootstrap --budget "${{ inputs.budget || '300' }}"
          else
            python main.py
          fi

      # ── Zretazenie ────────────────────────────────────────────────────────
      # Ak sa bootstrap nedokoncil, beh si zavola pokracovanie sam.
      # Strop 10 behov je poistka: keby sa nieco pokazilo a `hotovo` by uz
      # nikdy neprislo, nezozerie ti to vsetky minuty Actions.
      - name: Pokracovat, ak bootstrap nedobehol
        if: >
          inputs.bootstrap == true &&
          steps.pipeline.outputs.hotovo == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          CHAIN: ${{ inputs.chain || '0' }}
        run: |
          DALSI=$((CHAIN + 1))
          if [ "$DALSI" -ge 10 ]; then
            echo "::warning::Dosiahol som strop 10 behov v retazi a bootstrap "\
                 "stale nie je hotovy. Zastavujem, aby som nemínal minúty. "\
                 "Skontroluj vypis vyssie."
            exit 0
          fi
          echo "Bootstrap nedobehol. Spustam beh c. $DALSI z 10."
          gh workflow run pipeline.yml --ref main \
            -f bootstrap=true \
            -f budget="${{ inputs.budget || '300' }}" \
            -f chain="$DALSI"

      - name: Hotovo
        if: steps.pipeline.outputs.hotovo == 'true'
        run: echo "::notice::Bootstrap dokonceny. Dalej uz stacia ranne behy."
