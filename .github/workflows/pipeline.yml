name: Pipeline CRZ

on:
  schedule:
    # 05:10 UTC = 07:10 letny cas, pondelok az piatok
    - cron: "10 5 * * 1-5"
  workflow_dispatch:
    inputs:
      bootstrap:
        description: "Prvotne naplnenie databazy (dlhy beh)"
        type: boolean
        default: false
      budget:
        description: "Casovy rozpocet behu v minutach"
        type: string
        default: "45"

concurrency:
  group: pipeline
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - run: pip install -r pipeline/requirements.txt

      - name: Spustit pipeline
        working-directory: pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          TIME_BUDGET_MIN: ${{ inputs.budget || '45' }}
        run: |
          if [ "${{ inputs.bootstrap }}" = "true" ]; then
            python main.py --bootstrap --budget 300
          else
            python main.py
          fi
