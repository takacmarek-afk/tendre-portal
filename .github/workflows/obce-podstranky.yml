name: Obce podstranky

# ══════════════════════════════════════════════════════════════════════════
#  STAV: PRIPRAVENE, ESTE NEZAPNUTE NAOSTRO — pred odkomentovanim `schedule:`
#  spusti raz rucne cez workflow_dispatch a over v Actions logu aj priamo
#  na GitHube, ze vygenerovane /obce/kraj-*.html vyzeraju spravne.
#
#  CO TOTO ROBI
#  pipeline/generuj_obce_podstranky.py precita verejne anon-citatelne
#  agregaty (kraj_prehlad, sprostredkovatelia — ZIADNE riadkove/platene
#  data) a vyrobi staticke public/obce/kraj-*.html (po jednom na kraj),
#  public/obce/index.html a prepise public/sitemap.xml. Kedze cely web
#  je staticky (Cloudflare Pages, ziadny build), "vygenerovat" tu
#  doslovne znamena zapisat .html subory do repozitara — preto tento
#  beh, na rozdiel od pipeline.yml, potrebuje `contents: write`.
#
#  PRED PRVYM SPUSTENIM NAOSTRO
#  1. SUPABASE_URL / SUPABASE_SERVICE_ROLE_KEY uz su v Secrets (rovnake
#     ako pouziva pipeline.yml).
#  2. Test: workflow_dispatch — over v logu pocet vygenerovanych suborov
#     a pozri si vysledny commit/diff priamo na GitHube.
#  3. Az potom odkomentuj `schedule:` nizsie.
# ══════════════════════════════════════════════════════════════════════════

on:
  workflow_dispatch: {}

  # Raz do tyzdna staci — kraj_prehlad sa meni len tak rychlo, ako pribuda
  # novych dotacnych zmluv v CRZ (dennemu cronu pipeline.yml). Iny den
  # v tyzdni nez pozvanky/statistiky, aby vsetky tri nebezali v tu istu
  # chvilu.
  # schedule:
  #   - cron: "20 6 * * 3"

permissions:
  contents: write

concurrency:
  group: obce-podstranky
  cancel-in-progress: false

jobs:
  generuj:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - run: pip install -r pipeline/requirements.txt

      - name: Vygenerovat SEO podstranky /obce/kraj-*.html
        working-directory: pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python generuj_obce_podstranky.py

      - name: Commitnut zmeny, ak nejake su
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/obce/ public/sitemap.xml
          if git diff --cached --quiet; then
            echo "Ziadna zmena vo vygenerovanych strankach, nic sa necommitne."
          else
            git commit -m "Automaticky vygenerovane: SEO podstranky obce/kraj"
            git push
          fi

