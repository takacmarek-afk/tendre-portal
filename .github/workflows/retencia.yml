name: Retencia udajov

# Raz tyzdenne zmaze stare zaznamy podla lehot v zasadach ochrany osobnych
# udajov. Skript: pipeline/retencia_udajov.py, RPC z migracie 71.
# PRED PUSHOM musi byt v Supabase spustena migracia 71_retencia_udajov.sql.

on:
  workflow_dispatch:
    inputs:
      planovane:
        description: "Planovany beh (spusta externy planovac namiesto GitHub cronu)"
        type: boolean
        default: false
      nasucho:
        description: "Nasucho — nic nemazat"
        type: boolean
        default: true
  # Planovanie: Cloudflare Worker predtendrom-planovac (cloudflare/planovac/worker.js),
  # GitHub cron meskal 7-9 hodin. Povodne casy (UTC):
  #   - cron: "23 4 * * 0"

permissions:
  contents: read

concurrency:
  group: retencia
  cancel-in-progress: false

env:
  # Planovany beh = GitHub cron ALEBO externy planovac (workflow_dispatch s planovane=true)
  UDALOST: ${{ (github.event_name == 'schedule' || inputs.planovane) && 'schedule' || github.event_name }}

jobs:
  retencia:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - run: pip install -r pipeline/requirements.txt

      - name: Zmazat stare zaznamy
        working-directory: pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          EVENT: ${{ env.UDALOST }}
          NASUCHO: ${{ inputs.nasucho }}
        run: |
          set -euo pipefail
          ARGS=()
          if [ "$EVENT" = "workflow_dispatch" ] && [ "$NASUCHO" = "true" ]; then
            ARGS+=(--nasucho)
          fi
          python retencia_udajov.py "${ARGS[@]}"
