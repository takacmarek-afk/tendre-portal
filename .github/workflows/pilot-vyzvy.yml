name: Pilot vyzvy pre obce

# 1-click priprava pilotnej kampane (3. 11. 2026). Rovnake kroky ako
# skripty/setup_pilot.sh, ale bezi v GitHub Actions so secretmi pipeline.
# Migracie 89-92 sa spustaju v SQL editore / Management API PRED prvym behom.
# Repo aj logy su VEREJNE: skripty vypisuju len pocty, e-maily idu do
# tabulky kampan_pilot (len service_role).

on:
  workflow_dispatch:
    inputs:
      demografia:
        description: "Register obci: nasucho | zapis | preskocit"
        default: "zapis"
      odpad:
        description: "Faza A odpadu + prepocet prilezitosti"
        type: boolean
        default: true
      vyzvy:
        description: "Seed vyziev"
        type: boolean
        default: true
      kampan:
        description: "Vygenerovat e-maily do kampan_pilot"
        type: boolean
        default: true
      datum:
        description: "Datum odoslania kampane (YYYY-MM-DD)"
        default: "2026-11-24"

permissions:
  contents: read

concurrency:
  group: pilot-vyzvy
  cancel-in-progress: false

jobs:
  pilot:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      NO_COLOR: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -r pipeline/requirements.txt openpyxl

      - name: Register obci (pocet obyvatelov, NRO, MRK, ICO, typ)
        if: inputs.demografia != 'preskocit'
        working-directory: pipeline
        run: python obce_demografia.py ${{ inputs.demografia == 'zapis' && '--zapis' || '' }}

      - name: Odpad faza A
        if: inputs.odpad
        working-directory: pipeline
        run: python reprocess_odpad.py --len-a --zapis

      - name: Prepocet prilezitosti
        if: inputs.odpad
        working-directory: pipeline
        run: python main.py --iba-prepocet

      - name: Seed vyziev
        if: inputs.vyzvy
        run: node --experimental-strip-types --no-warnings skripty/seed_vyzvy.ts --zapis

      - name: E-maily kampane do kampan_pilot
        if: inputs.kampan
        # Chybu (bez kontaktov) dame do anotacie, logy sa z verejneho repa citaju tazko
        run: |
          set -o pipefail
          node --experimental-strip-types --no-warnings skripty/generuj-kampan.ts --zapis --do-db --tichy --datum "${{ inputs.datum }}" > vystup.txt 2>&1 \
            || { echo "::error::$(grep -v '@' vystup.txt | tail -c 900 | tr '\n' ' ')"; exit 1; }
          echo "::notice::$(grep -v '@' vystup.txt | tr '\n' ' ' | tail -c 900)"
