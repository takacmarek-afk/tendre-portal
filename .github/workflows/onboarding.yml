name: Uvitacie e-maily

# Pat e-mailov po registracii (den 0, 1, 3, 7 a 2 dni pred koncom skusky).
# Skript: pipeline/posli_onboarding.py, RPC z migracie 86.
# PRED PRVYM BEHOM musi byt v Supabase spustena migracia 86_onboarding.sql.

on:
  workflow_dispatch:
    inputs:
      planovane:
        description: "Planovany beh (spusta externy planovac namiesto GitHub cronu)"
        type: boolean
        default: false
      nasucho:
        description: "Nasucho — nic neposielat, len vypisat texty"
        type: boolean
        default: true
  schedule:
    - cron: "7 7,11,15 * * *"     # 3x denne (9:07, 13:07, 17:07 letneho casu)

permissions:
  contents: read

concurrency:
  group: onboarding
  cancel-in-progress: false

env:
  # Planovany beh = GitHub cron ALEBO externy planovac (workflow_dispatch s planovane=true)
  UDALOST: ${{ (github.event_name == 'schedule' || inputs.planovane) && 'schedule' || github.event_name }}

jobs:
  posli:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - name: Poslat uvitacie e-maily
        working-directory: pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EVENT: ${{ env.UDALOST }}
          NASUCHO: ${{ inputs.nasucho }}
        run: |
          set -euo pipefail
          ARGS=()
          if [ "$EVENT" = "workflow_dispatch" ] && [ "$NASUCHO" = "true" ]; then
            ARGS+=(--nasucho)
          fi
          python posli_onboarding.py "${ARGS[@]}"
