name: Obrana zmluv

# Upozornenie vlastnikovi/adminovi, ked urad, ktoremu organizacia dodava
# (zmluva na jej ICO konci do 12 mesiacov), vyhlasil sutaz v tom istom sektore.
# Skript: pipeline/posli_obranu_zmluv.py, RPC z migracie 78.
# PRED PUSHOM musi byt v Supabase spustena migracia 78.

on:
  workflow_dispatch:
    inputs:
      nasucho:
        description: "Nasucho — nic neposielat, len vypisat"
        type: boolean
        default: true
  schedule:
    - cron: "22 7 * * *"

permissions:
  contents: read

concurrency:
  group: obrana-zmluv
  cancel-in-progress: false

jobs:
  posli:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - run: pip install -r pipeline/requirements.txt

      - name: Poslat upozornenia
        working-directory: pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EVENT: ${{ github.event_name }}
          NASUCHO: ${{ inputs.nasucho }}
        run: |
          set -euo pipefail
          ARGS=()
          if [ "$EVENT" = "workflow_dispatch" ] && [ "$NASUCHO" = "true" ]; then
            ARGS+=(--nasucho)
          fi
          echo "Spustam: python posli_obranu_zmluv.py ${ARGS[*]-}"
          python posli_obranu_zmluv.py "${ARGS[@]}"
