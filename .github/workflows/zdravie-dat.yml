name: Zdravie dat

# Denna straz cerstvosti dat (audit 10. 11. 2026). Pri vypadku zdroja posle
# e-mail na info@predtendrom.sk a beh skonci chybou.
on:
  # Planovanie: Cloudflare Worker predtendrom-planovac (cloudflare/planovac/worker.js),
  # GitHub cron meskal 7-9 hodin. Povodne casy (UTC):
  #   - cron: "47 7 * * *"
  # Zalozny GitHub cron (aj ked mesk): ak by Cloudflare planovac prestal
  # spustat ulohy, tato kontrola to aspon raz denne zisti a posle e-mail.
  schedule:
    - cron: "13 9 * * *"
  workflow_dispatch:
    inputs:
      planovane:
        description: "Planovany beh (spusta externy planovac namiesto GitHub cronu)"
        type: boolean
        default: false
      nasucho:
        description: "Len vypisat"
        type: boolean
        default: true

permissions:
  contents: read
  actions: read

env:
  # Planovany beh = GitHub cron ALEBO externy planovac (workflow_dispatch s planovane=true)
  UDALOST: ${{ (github.event_name == 'schedule' || inputs.planovane) && 'schedule' || github.event_name }}

jobs:
  zdravie:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - name: Kontrola
        working-directory: pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ZOHO_SMTP_PASSWORD: ${{ secrets.ZOHO_SMTP_PASSWORD }}
          GITHUB_TOKEN: ${{ github.token }}
        run: python zdravie_dat.py ${{ (env.UDALOST == 'workflow_dispatch' && inputs.nasucho) && '--nasucho' || '' }}
