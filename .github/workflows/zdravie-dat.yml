name: Zdravie dat

# Denna straz cerstvosti dat (audit 10. 11. 2026). Pri vypadku zdroja posle
# e-mail na info@predtendrom.sk a beh skonci chybou.
on:
  schedule:
    - cron: "47 7 * * *"
  workflow_dispatch:
    inputs:
      nasucho:
        description: "Len vypisat"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  zdravie:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - name: Kontrola
        working-directory: pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ZOHO_SMTP_PASSWORD: ${{ secrets.ZOHO_SMTP_PASSWORD }}
        run: python zdravie_dat.py ${{ (github.event_name == 'workflow_dispatch' && inputs.nasucho) && '--nasucho' || '' }}
