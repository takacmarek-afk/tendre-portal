name: RUZ financny kontext

# ══════════════════════════════════════════════════════════════════════════
#  STAV: NAOSTRO, schedule zapnuty (22.9.2026) — pred zapnutim overene
#  viacerymi ostrymi rucnymi behmi (workflow_dispatch, nasucho=false) v
#  tejto session, vratane opravy strankovania (1000-row cap) a
#  KeyError('tabulky') v pipeline/ruz.py a pipeline/obohat_financie.py
#  (commit ac88a15). Vysledky overene priamo v Supabase tabulkach
#  ruz_zaklad/ruz_financie, nie len z hlasenia "success".
#
#  CO TOTO ROBI
#  Pre ICO z tabulky `dodavatelia` (uz len pravnicke osoby, viz
#  pipeline/config.py PRAVNE_FORMY) dotiahne z Registra uctovnych
#  zavierok (registeruz.sk, verejne API, CC0) obrat, vysledok
#  hospodarenia za poslednych par rokov a NACE sektor. Zapisuje do
#  ruz_zaklad / ruz_financie (supabase/35_ruz_financie.sql), Team-only
#  gate cez ma_team(). Samostatny beh od hlavnej pipeline (pipeline.yml)
#  — zlyhanie RUZ API nema strhnut denny prepocet zmluv/prilezitosti.
#
#  DAVKOVANIE: jeden beh spracuje najviac `limit` ICO (default 150),
#  najprv tie bez zaznamu, potom najstarsie skontrolovane. Opakovanymi
#  behmi (rucne, potom podla schedule) sa postupne pokryje cela zakladna
#  (~2000+ dodavatelov) a drzi sa aktualna (RUZ zavierky sa menia rocne).
#
#  RETAZENIE BEHOV (22. vlna, 21.9.2026): kazdy beh ma svoj vlastny 40-min
#  casovy rozpocet (RUZ_TIME_BUDGET_MIN v obohat_financie.py) a job timeout
#  60 min — nestihne cela zakladna naraz (GitHub navyse ma tvrdy strop 360
#  min na jeden job, co by aj tak nestacilo). Preto posledny krok nizsie po
#  ostrom (nie --nasucho) rucnom behu automaticky spusti dalsi beh sam
#  seba cez `gh workflow run`, ak obohat_financie.py nahlasi, ze este
#  zostavaju nespracovane ICO. Kazdy jednotlivy beh je nezavisly a
#  bezpecny (concurrency skupina nizsie zarucuje, ze nikdy nepobezia dva
#  naraz); retazenie sa samo zastavi, ked dojdu kandidati, alebo ak
#  jeden beh nespracoval ani jedno ICO (poistka proti nekonecnej slucke
#  pri chybe). `--nasucho` sa nikdy neretazi (nic by sa nezapisalo, takze
#  by chain bezal navzdy).
# ══════════════════════════════════════════════════════════════════════════

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Kolko ICO spracovat v tomto behu"
        type: string
        default: "150"
      force:
        description: "Skontrolovat aj cerstvo skontrolovane ICO"
        type: boolean
        default: false
      nasucho:
        description: "Nasucho — nic nezapisat, len vypisat (nechaj true, kym si neistý)"
        type: boolean
        default: true

  # Raz denne, mimo hlavneho pipeline behu (05:10 UTC, viz pipeline.yml).
  # RUZ zavierky sa menia rocne, ale denna davka postupne pokryje/obnovi
  # celu zakladnu bez toho, aby jeden beh musel spracovat vsetko naraz.
  schedule:
    - cron: "40 4 * * *"

permissions:
  contents: read
  # actions: write je potrebne LEN pre retazenie behov nizsie (gh workflow
  # run na seba sameho po ostrom behu s este nespracovanymi ICO). Nedava
  # to ziadny pristup k obsahu repozitara navyse.
  actions: write

concurrency:
  group: ruz-financie
  cancel-in-progress: false

jobs:
  obohat:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - run: pip install -r pipeline/requirements.txt

      - name: Obohatit dodavatelov o RUZ financny kontext
        id: obohat
        working-directory: pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          # Rovnaky dovod ako v pozvanky.yml/email.yml: vstupy idu cez
          # premenne prostredia, nie priamo interpolovane do shell prikazu.
          EVENT: ${{ github.event_name }}
          LIMIT: ${{ inputs.limit }}
          FORCE: ${{ inputs.force }}
          NASUCHO: ${{ inputs.nasucho }}
        run: |
          set -euo pipefail
          ARGS=(--limit "${LIMIT:-150}")
          if [ "$FORCE" = "true" ]; then
            ARGS+=(--force)
          fi
          if [ "$EVENT" = "workflow_dispatch" ] && [ "$NASUCHO" = "true" ]; then
            ARGS+=(--nasucho)
          fi
          echo "Spustam: python obohat_financie.py ${ARGS[*]}"
          python obohat_financie.py "${ARGS[@]}"

      - name: Spustit dalsi beh, ak zostavaju dalsie ICO (retazenie behov)
        # Len po rucnom ostrom (nie --nasucho) behu, len ak sa v tomto behu
        # skutocne nieco spracovalo (poistka proti nekonecnej slucke pri
        # chybe), a len ak obohat_financie.py nahlasil, ze este zostavaju
        # nespracovane ICO. Pozri poznamku o retazeni na zaciatku suboru.
        if: |
          steps.obohat.outputs.zostava == 'true' &&
          steps.obohat.outputs.spracovanych != '0' &&
          github.event_name == 'workflow_dispatch' &&
          inputs.nasucho != 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NEXT_LIMIT: ${{ inputs.limit }}
          NEXT_FORCE: ${{ inputs.force }}
        run: |
          set -euo pipefail
          echo "Zostavaju dalsie ICO (spracovanych v tomto behu: ${{ steps.obohat.outputs.spracovanych }}), spustam dalsi beh."
          sleep 10
          gh workflow run ruz-financie.yml --repo "${{ github.repository }}" --ref main \
            -f limit="${NEXT_LIMIT:-150}" \
            -f force="${NEXT_FORCE:-false}" \
            -f nasucho=false
