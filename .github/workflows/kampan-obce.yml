name: Kampan pre obce

# ══════════════════════════════════════════════════════════════════════════
#  CO TOTO ROBI
#  Kampan pre obce po volbach 2026 (Claude Doc "Kampan pre obce po volbach
#  2026"). Len rucne spustenie — ziadny cron. Kazdy krok sa da pustit
#  nasucho (default), ktory nic nezapise ani neposle.
#
#  KROKY
#   volby     — nacita zvolenych starostov a primatorov z otvorenych dat SU SR
#               (pipeline/volby.py). Rok 2022 = overenie formatu, 2026 po
#               zverejneni vysledkov volieb (24. 10. 2026).
#   kontakty  — z Vestnika UVO vyberie zverejnene uradne e-maily obci
#               a zapise ich do kampan_obce_kontakty (pipeline/kampan_obce.py).
#   web       — e-maily obci z ich webov (tabulka obce_web_kontakty, migracia
#               102) -> kontakty kampane (pipeline/obce_web_kontakty.py).
#   posli     — personalizovane e-maily. Nasucho vyrobi NAHLAD vsetkych
#               e-mailov (Artifacts -> kampan-nahlad, subor nahlad.html).
#               S "komu" posle 3 testovacie e-maily len na tu adresu.
#               Ostro (nasucho=false, komu prazdne): najviac "max" obci za
#               den, len od datumu vlny a len utorok az stvrtok.
#
#  PRED PRVYM OSTRYM ODOSLANIM
#   Settings -> Secrets and variables -> Actions -> New repository secret:
#     KAMPAN_REPLY_TO  — adresa, kam maju prist odpovede obci (povinne)
#     KAMPAN_TELEFON   — telefon do podpisu (nepovinne)
#     ZOHO_SMTP_PASSWORD — heslo aplikacie pre marek@predtendrom.sk (Zoho Mail).
#   Kampan NEJDE cez Resend: jeho pravidla zakazuju studene e-maily.
# ══════════════════════════════════════════════════════════════════════════

on:
  # Od 11. 11. 2026 posiela vlnu 1 automaticky (rozhodnutie Mareka): utorok az
  # stvrtok rano. kampan_obce.py sam pusti ostro len od datumu vlny (24. 11.)
  # a len ut-st; mimo okna 8:00-16:00 planovany beh nic neposle.
  schedule:
    - cron: "23 7 * * 2-4"   # 8:23 SEC (zima)
  workflow_dispatch:
    inputs:
      planovane:
        description: "Planovany beh (spusta externy planovac namiesto GitHub cronu)"
        type: boolean
        default: false
      krok:
        description: "Krok"
        type: choice
        options: [posli, kontakty, volby, web]
        default: posli
      nasucho:
        description: "Nasucho — nic nezapisat ani neposlat (nechaj true, kym si neisty)"
        type: boolean
        default: true
      vlna:
        description: "Vlna (krok posli)"
        type: choice
        options: [vlna1, vlna2]
        default: vlna1
      komu:
        description: "Test: poslat 3 e-maily len na tuto adresu (krok posli)"
        type: string
        default: ""
      max:
        description: "Najviac e-mailov za den (krok posli)"
        type: string
        default: "50"
      rok:
        description: "Rok volieb (krok volby)"
        type: string
        default: "2026"

permissions:
  contents: read

concurrency:
  group: kampan-obce
  cancel-in-progress: false

env:
  # Planovany beh = GitHub cron ALEBO externy planovac (workflow_dispatch s planovane=true)
  UDALOST: ${{ (github.event_name == 'schedule' || inputs.planovane) && 'schedule' || github.event_name }}

jobs:
  kampan:
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - run: pip install -r pipeline/requirements.txt

      - name: Spustit krok
        working-directory: pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ZOHO_SMTP_PASSWORD: ${{ secrets.ZOHO_SMTP_PASSWORD }}
          KAMPAN_REPLY_TO: ${{ secrets.KAMPAN_REPLY_TO }}
          KAMPAN_TELEFON: ${{ secrets.KAMPAN_TELEFON }}
          KROK: ${{ inputs.krok || 'posli' }}
          NASUCHO: ${{ env.UDALOST == 'schedule' && 'false' || inputs.nasucho }}
          VLNA: ${{ inputs.vlna || 'vlna1' }}
          KOMU: ${{ inputs.komu }}
          MAX: ${{ inputs.max || vars.KAMPAN_OBCE_MAX || '50' }}
          PLANOVANY: ${{ env.UDALOST == 'schedule' }}
          ROK: ${{ inputs.rok }}
        run: |
          set -euo pipefail
          if [ "$PLANOVANY" = "true" ]; then
            H=$(TZ=Europe/Bratislava date +%H)
            if [ "$H" -lt 8 ] || [ "$H" -ge 16 ]; then
              echo "::notice::Planovany beh prisiel o $H:00 (mimo 8-16), nic sa neposiela."
              exit 0
            fi
          fi
          SUCHO=()
          if [ "$NASUCHO" = "true" ]; then SUCHO=(--nasucho); fi
          case "$KROK" in
            volby)
              python volby.py --rok "${ROK:-2026}" "${SUCHO[@]}" ;;
            kontakty)
              python kampan_obce.py kontakty "${SUCHO[@]}" ;;
            web)
              python obce_web_kontakty.py "${SUCHO[@]}" ;;
            posli)
              ARGS=(posli --vlna "$VLNA" --max "${MAX:-50}" --nahlad nahlad.html)
              if [ -n "${KOMU:-}" ]; then ARGS+=(--komu "$KOMU"); fi
              python kampan_obce.py "${ARGS[@]}" "${SUCHO[@]}" ;;
          esac

      - name: Nahlad e-mailov
        if: inputs.krok == 'posli' && always()
        uses: actions/upload-artifact@v4
        with:
          name: kampan-nahlad
          path: pipeline/nahlad.html
          if-no-files-found: ignore
          retention-days: 14
