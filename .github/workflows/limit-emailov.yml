name: Limit e-mailov

# Denne skontroluje, kolko e-mailov odislo cez Resend (Free: 100/den, 3000/mesiac).
# Pri 70 % posle Marekovi upozornenie na info@predtendrom.sk (cez Zoho).
on:
  schedule:
    - cron: "47 15 * * *"
  workflow_dispatch:
    inputs:
      nasucho:
        description: "Len vypisat pocty"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  limit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - name: Kontrola
        working-directory: pipeline
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ZOHO_SMTP_PASSWORD: ${{ secrets.ZOHO_SMTP_PASSWORD }}
        run: python limit_emailov.py ${{ (github.event_name == 'workflow_dispatch' && inputs.nasucho) && '--nasucho' || '' }}
