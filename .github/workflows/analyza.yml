name: Analyza (len citanie)

# Jednorazove suhrnne prehlady z databazy. Len citanie, len pocty a verejne
# nazvy firiem v anotacii (repo aj logy su verejne).
on:
  workflow_dispatch:
    inputs:
      skript:
        description: "Prehlad"
        type: choice
        options: [poradcovia_prehlad, vyzvy_prehlad, trh_overenie, imap_sonda, itms_sonda]
        default: poradcovia_prehlad

permissions:
  contents: read

jobs:
  analyza:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - name: Prehlad
        working-directory: pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ZOHO_SMTP_PASSWORD: ${{ secrets.ZOHO_SMTP_PASSWORD }}
          ZOHO_IMAP_PASSWORD: ${{ secrets.ZOHO_IMAP_PASSWORD }}
        run: python "${{ inputs.skript }}.py"
