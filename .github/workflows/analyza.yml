name: Analyza (len citanie)

# Jednorazove suhrnne prehlady z databazy. Len citanie, len pocty a verejne
# nazvy firiem v anotacii (repo aj logy su verejne).
on:
  workflow_dispatch:
    inputs:
      skript:
        description: "Prehlad"
        type: choice
        options: [poradcovia_prehlad, vyzvy_prehlad, trh_overenie, imap_sonda, itms_sonda, oprava_audit, itms_parovanie, audit_db, resend_dorucenie]
        default: poradcovia_prehlad

permissions:
  contents: read

jobs:
  analyza:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - name: Prehlad
        if: inputs.skript != 'audit_db'
        working-directory: pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ZOHO_SMTP_PASSWORD: ${{ secrets.ZOHO_SMTP_PASSWORD }}
          ZOHO_IMAP_PASSWORD: ${{ secrets.ZOHO_IMAP_PASSWORD }}
          RESEND_ADMIN_KEY: ${{ secrets.RESEND_ADMIN_KEY }}
        run: python "${{ inputs.skript }}.py"
      - name: Audit databazy (len citanie, psql)
        if: inputs.skript == 'audit_db'
        env:
          DB: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          docker run --rm -e DB -v "$PWD/supabase/audit:/a:ro" postgres:17-alpine \
            sh -c "psql \"\$DB\" -q -X -f /a/audit_db.sql" 2>&1 | grep -v -iE "@|password" 
