name: Migracia databazy

# Spusti JEDEN subor supabase/<cislo>_*.sql v produkcnej databaze (psql,
# ON_ERROR_STOP, jedna transakcia). Len rucne. Do logu ide len nazov suboru
# a vysledok (repo aj logy su verejne). Migracie su pisane tak, aby sa dali
# spustit opakovane.
on:
  workflow_dispatch:
    inputs:
      subor:
        description: "Subor v supabase/, napr. 95_kontrola_trh_firmy.sql"
        required: true

permissions:
  contents: read

concurrency:
  group: migracia
  cancel-in-progress: false

jobs:
  migracia:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Over subor
        env:
          SUBOR: ${{ inputs.subor }}
        run: |
          [[ "$SUBOR" =~ ^[0-9]{2,3}_[a-z0-9_]+\.sql$ ]] || { echo "::error::Neplatny nazov suboru"; exit 1; }
          [ -f "supabase/$SUBOR" ] || { echo "::error::Subor neexistuje"; exit 1; }
      - name: Spustit (PostgreSQL 17 klient)
        env:
          DB: ${{ secrets.SUPABASE_DB_URL }}
          SUBOR: ${{ inputs.subor }}
        run: |
          docker run --rm -e DB -v "$PWD/supabase:/m:ro" postgres:17-alpine \
            sh -c "psql \"\$DB\" -v ON_ERROR_STOP=1 -1 -q -X -At -f /m/$SUBOR" > vystup.txt 2>&1 \
            || { echo "::error title=Migracia $SUBOR::$(tail -c 600 vystup.txt | tr '\n' ' ')"; exit 1; }
          echo "::notice title=Migracia $SUBOR::$(tail -c 400 vystup.txt | tr '\n' ' ')"
