name: Dopyty email

# ══════════════════════════════════════════════════════════════════════════
#  STAV: NOVE (28.9.2026), este NEODOSKUSANE ZIVO. Riesi zistenie Mareka z
#  toho isteho dna: vytvorenie/reakcia na dopyt (Trh dopytov, 34_obce_
#  marketplace.sql) doteraz neposielali ziadny e-mail. Podrobnosti a dovod,
#  preco castejsi cron a nie okamzity DB trigger, su v komentari na zaciatku
#  supabase/54_dopyty_notifikacie.sql a pipeline/posli_dopyt_email.py.
#
#  PRED PRVYM NAOSTRO SPUSTENIM (rovnaky postup ako pri email.yml):
#  1. supabase/54_dopyty_notifikacie.sql uz musi byt spustena v Supabase
#     (nove stlpce poradcovia_notifikovani/obec_notifikovana).
#  2. Rucne: workflow_dispatch s nasucho=true — over v logu, ze sa nic
#     neposiela a pocty davaju zmysel.
#  3. Rucne: workflow_dispatch s nasucho=false a komu=tvoj@email.sk — over
#     doruceny e-mail. (Ak vtedy v databaze nie je ziadny nenotifikovany
#     dopyt/reakcia, najprv si nejaky vytvor cez trh.html, presne ako pri
#     povodnom testovani.)
#  4. Az potom ODKOMENTUJ "schedule:" blok nizsie (dnes zamerne vypnuty,
#     rovnaky opatrny postup ako mal na zaciatku email.yml) — do dalsej
#     vlny, alebo si to viete odkomentovat aj sami priamo na GitHub-e
#     (Settings nie su treba, staci upravit tento subor).
#
#  Ziadne nove tajomstva — pouziva presne tie iste tri (SUPABASE_URL,
#  SUPABASE_SERVICE_ROLE_KEY, RESEND_API_KEY), co uz ma email.yml.
# ══════════════════════════════════════════════════════════════════════════

on:
  workflow_dispatch:
    inputs:
      nasucho:
        description: "Nasucho — nic neposielat, len vypisat (nechaj true, kym si neistý)"
        type: boolean
        default: true
      komu:
        description: "Poslat len na tuto adresu (na test). Prazdne = vsetkym, komu prislo na rad."
        type: string
        default: ""

  # ZAMERNE VYPNUTE, kym si to neodskusame (viz poznamka vyssie, kroky 1-3).
  # Kazdych 15 minut, cely tyzden (dopyty a reakcie nie su viazane na
  # pracovny den ako tyzdenny digest v email.yml). Nie je to okamzite, ale
  # je to nepomerne lepsie nez sucasny stav (nic).
  # schedule:
  #   - cron: "*/15 * * * *"

permissions:
  contents: read

concurrency:
  group: dopyty-email
  cancel-in-progress: false

jobs:
  posli:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - run: pip install -r pipeline/requirements.txt

      - name: Poslat notifikacie o dopytoch a reakciach
        working-directory: pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          # Rovnaky dovod ako v email.yml: vstupy chodia cez premenne
          # prostredia, nie priamo vlepene do shell prikazu.
          EVENT: ${{ github.event_name }}
          NASUCHO: ${{ inputs.nasucho }}
          KOMU: ${{ inputs.komu }}
        run: |
          set -euo pipefail
          ARGS=()
          if [ "$EVENT" = "workflow_dispatch" ] && [ "$NASUCHO" = "true" ]; then
            ARGS+=(--nasucho)
          fi
          if [ -n "${KOMU:-}" ]; then
            ARGS+=(--komu "$KOMU")
          fi
          echo "Spustam: python posli_dopyt_email.py ${ARGS[*]-}"
          python posli_dopyt_email.py "${ARGS[@]}"
