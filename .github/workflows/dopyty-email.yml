name: Dopyty email

# ══════════════════════════════════════════════════════════════════════════
#  STAV: ZAPNUTE NAOSTRO (28.9.2026). Riesi zistenie Mareka z toho isteho
#  dna: vytvorenie/reakcia na dopyt (Trh dopytov, 34_obce_marketplace.sql)
#  doteraz neposielali ziadny e-mail. Podrobnosti a dovod, preco castejsi
#  cron a nie okamzity DB trigger, su v komentari na zaciatku
#  supabase/54_dopyty_notifikacie.sql a pipeline/posli_dopyt_email.py.
#
#  Pred zapnutim odskusane naozaj naziva (28.9.2026, s docasnymi testovacimi
#  zaznamami, hned potom zmazanymi): workflow_dispatch s nasucho=true (0/0,
#  ziadna chyba), potom s nasucho=false a komu=Marekov e-mail — obe strany
#  (poradca aj obec) dostali e-mail, log hlasi "poradcom poslanych 1
#  (zlyhanych 0), obciam poslanych 1 (zlyhanych 0)".
#
#  AK BY SI NIEKEDY POTREBOVAL VYPNUT CELE POSIELANIE:
#  Zakomentuj `schedule:` blok nizsie (rovnaky vzor ako v email.yml) — rucne
#  spustenie cez workflow_dispatch (s nasucho=true na test) funguje aj tak.
#
#  Ziadne nove tajomstva — pouziva presne tie iste tri (SUPABASE_URL,
#  SUPABASE_SERVICE_ROLE_KEY, RESEND_API_KEY), co uz ma email.yml.
# ══════════════════════════════════════════════════════════════════════════

on:
  workflow_dispatch:
    inputs:
      nasucho:
        description: "Nasucho — nic neposielat, len vypisat (nechaj true, kym si neistý)"
        type: boolean
        default: true
      komu:
        description: "Poslat len na tuto adresu (na test). Prazdne = vsetkym, komu prislo na rad."
        type: string
        default: ""

  # Kazdych 15 minut, cely tyzden (dopyty a reakcie nie su viazane na
  # pracovny den ako tyzdenny digest v email.yml). Nie je to okamzite, ale
  # je to nepomerne lepsie nez sucasny stav (nic).
  schedule:
    - cron: "*/15 * * * *"

permissions:
  contents: read

concurrency:
  group: dopyty-email
  cancel-in-progress: false

jobs:
  posli:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - run: pip install -r pipeline/requirements.txt

      - name: Poslat notifikacie o dopytoch a reakciach
        working-directory: pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          # Rovnaky dovod ako v email.yml: vstupy chodia cez premenne
          # prostredia, nie priamo vlepene do shell prikazu.
          EVENT: ${{ github.event_name }}
          NASUCHO: ${{ inputs.nasucho }}
          KOMU: ${{ inputs.komu }}
        run: |
          set -euo pipefail
          ARGS=()
          if [ "$EVENT" = "workflow_dispatch" ] && [ "$NASUCHO" = "true" ]; then
            ARGS+=(--nasucho)
          fi
          if [ -n "${KOMU:-}" ]; then
            ARGS+=(--komu "$KOMU")
          fi
          echo "Spustam: python posli_dopyt_email.py ${ARGS[*]-}"
          python posli_dopyt_email.py "${ARGS[@]}"
