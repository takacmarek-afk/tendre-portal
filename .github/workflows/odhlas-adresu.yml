name: Odhlasit adresu

# Rucne odhlasenie jednej adresy zo vsetkych rozosielani. Vstup je len
# SHA-256 adresy (repo aj logy su verejne), nikdy samotna adresa.
on:
  workflow_dispatch:
    inputs:
      hash:
        description: "SHA-256 adresy (male pismena)"
        type: string
        required: true
      zapis:
        description: "Odhlasit (inak len vyhladat)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  odhlas:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - working-directory: pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          HASH: ${{ inputs.hash }}
          ZAPIS: ${{ inputs.zapis && '1' || '0' }}
        run: python odhlas_adresu.py
