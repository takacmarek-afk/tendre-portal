name: Oslovenie firiem

# ══════════════════════════════════════════════════════════════════════════
#  CO TOTO ROBI
#  Tri osobne e-maily dodavatelom verejneho sektora (plan predaja, sekcia 3).
#  Len rucne spustenie. Kazdy krok sa da pustit nasucho (default).
#
#  KROKY
#   kontakty — z Vestnika UVO vyberie zverejnene e-maily vitazov sutazi
#              (BT-506) do oslovenie_firiem_kontakty (pipeline/oslovenie_firiem.py)
#   posli    — nasucho vyrobi NAHLAD (Artifacts -> oslovenie-nahlad).
#              S "komu" posle 3 testovacie e-maily len na tu adresu.
#              Ostro: nadvazujuce kroky + "novych" novych firiem, najviac "max"
#              za den, len pondelok az stvrtok 8:00–16:00.
#   zastav   — firma odpovedala: zadaj ICO (oddelene ciarkou) do "ico".
#
#  ODOSIELA SA CEZ ZOHO (marek@predtendrom.sk), NIE CEZ RESEND.
#  Potrebne secrets: ZOHO_SMTP_PASSWORD, KAMPAN_REPLY_TO.
# ══════════════════════════════════════════════════════════════════════════

on:
  # Automaticky beh (schvalil Marek 2. 11. 2026, posun na 8:17 4. 11.): pondelok az stvrtok o 8:17
  # (zimny cas; v lete 9:17). Nadvazujuce kroky + 30 novych firiem zo vsetkych
  # segmentov, najviac 45 e-mailov za den. Firmu, ktora odpovedala, treba
  # zastavit krokom "zastav" (ICO), inak dostane dalsi krok.
  # Planovanie: Cloudflare Worker predtendrom-planovac (cloudflare/planovac/worker.js),
  # GitHub cron meskal 7-9 hodin. Povodne casy (UTC):
  #   - cron: "17 7 * * 1-4"   # 8:17 SEC (zima); skor ako 9:13, lebo GitHub planovane behy oneskoruje a okno je 8:00-16:00
  workflow_dispatch:
    inputs:
      planovane:
        description: "Planovany beh (spusta externy planovac namiesto GitHub cronu)"
        type: boolean
        default: false
      krok:
        description: "Krok"
        type: choice
        options: [posli, kontakty, zastav]
        default: posli
      nasucho:
        description: "Nasucho — nic nezapisat ani neposlat (nechaj true, kym si neisty)"
        type: boolean
        default: true
      segmenty:
        description: "Segmenty (krok posli), oddelene ciarkou"
        type: string
        default: "UPRATOVANIE,OSTRAHA"
      novych:
        description: "Kolko novych firiem dnes zacat (krok posli)"
        type: string
        default: "0"
      komu:
        description: "Test: poslat 3 e-maily len na tuto adresu (krok posli)"
        type: string
        default: ""
      max:
        description: "Najviac e-mailov za den spolu (krok posli)"
        type: string
        default: "30"
      ico:
        description: "ICO alebo @domena firiem, ktore odpovedali (krok zastav), oddelene ciarkou"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: oslovenie-firiem
  cancel-in-progress: false

env:
  # Planovany beh = GitHub cron ALEBO externy planovac (workflow_dispatch s planovane=true)
  UDALOST: ${{ (github.event_name == 'schedule' || inputs.planovane) && 'schedule' || github.event_name }}

jobs:
  oslovenie:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - run: pip install -r pipeline/requirements.txt

      - name: Spustit krok
        working-directory: pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ZOHO_SMTP_PASSWORD: ${{ secrets.ZOHO_SMTP_PASSWORD }}
          # 10. 11. 2026: odpovede do schranky, ktoru cita pipeline/odpovede.py (schvalil Marek)
          KAMPAN_REPLY_TO: marek@predtendrom.sk
          KROK: ${{ inputs.krok || 'posli' }}
          NASUCHO: ${{ env.UDALOST == 'schedule' && 'false' || inputs.nasucho }}
          SEGMENTY: ${{ env.UDALOST == 'schedule' && 'UPRATOVANIE,OSTRAHA,STRAVOVANIE,ZELEN_ZIMNA_UDRZBA,UPRATOVANIE_TOVAR,OSTRAHA_TECHNIKA,STAVEBNE_PRACE,IT_TECHNIKA,ODPAD,ELEKTROINSTALACIE,KURENIE_VODA_PLYN,STRECHY_IZOLACIE,OKNA_DVERE_POVRCHY,DOPRAVA_MECHANIZACIA,TLAC_KANCELARIA,PASPORTIZACIA_SPRAVA_BUDOV' || inputs.segmenty }}
          NOVYCH: ${{ env.UDALOST == 'schedule' && '30' || inputs.novych }}
          KOMU: ${{ inputs.komu }}
          MAX: ${{ env.UDALOST == 'schedule' && '45' || inputs.max }}
          ICO: ${{ inputs.ico }}
        run: |
          set -euo pipefail
          # 10. 11. 2026: GitHub planovany beh oneskoril o 8 hodin (15:38 UTC).
          # Mimo okna 8:00-16:00 sa nic neposiela; planovany beh vtedy skonci
          # bez chyby (posiela aj naplanovana uloha o 8:21, unikatnost ico+krok
          # zabrani dvojitemu poslaniu).
          if [ "${{ env.UDALOST }}" = "schedule" ]; then
            H=$(TZ=Europe/Bratislava date +%H)
            if [ "$H" -lt 8 ] || [ "$H" -ge 16 ]; then
              echo "::notice::Planovany beh prisiel o $H:00 (mimo 8-16), nic sa neposiela."
              exit 0
            fi
          fi
          SUCHO=()
          if [ "$NASUCHO" = "true" ]; then SUCHO=(--nasucho); fi
          case "$KROK" in
            kontakty)
              python oslovenie_firiem.py kontakty "${SUCHO[@]}" ;;
            zastav)
              python oslovenie_firiem.py zastav --ico "$ICO" ;;
            posli)
              ARGS=(posli --segmenty "$SEGMENTY" --novych "${NOVYCH:-0}" --max "${MAX:-30}" --nahlad nahlad.html)
              if [ -n "${KOMU:-}" ]; then ARGS+=(--komu "$KOMU"); fi
              python oslovenie_firiem.py "${ARGS[@]}" "${SUCHO[@]}" 2>&1 | tee ../beh.log ;;
          esac

      - name: Zhrnutie (anotacia, bez e-mailovych adries)
        if: (inputs.krok == 'posli' || env.UDALOST == 'schedule') && always()
        run: |
          [ -f beh.log ] || exit 0
          S=$(grep -E "Kontaktov|Novych firiem|Odbor nesedel|NASUCHO|OSTRO|HOTOVO|CHYBA|ERROR|krok [123] " beh.log | sed -E 's/<[^>]*>//; s/ -> [^ |]+@[^ |]+//; s/[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+//g' | head -60 | sed ':a;N;$!ba;s/\n/%0A/g')
          echo "::notice title=Oslovenie firiem::$S"

      - name: Nahlad e-mailov
        if: (inputs.krok == 'posli' || env.UDALOST == 'schedule') && always()
        uses: actions/upload-artifact@v7
        with:
          name: oslovenie-nahlad
          path: pipeline/nahlad.html
          if-no-files-found: ignore
          retention-days: 14
