name: Prehlad navstev

# Suhrnne cisla navstevnosti a lievika ako anotacia behu (bez osobnych udajov).
on:
  workflow_dispatch:
    inputs:
      planovane:
        description: "Planovany beh (spusta externy planovac namiesto GitHub cronu)"
        type: boolean
        default: false
  # Planovanie: Cloudflare Worker predtendrom-planovac (cloudflare/planovac/worker.js),
  # GitHub cron meskal 7-9 hodin. Povodne casy (UTC):
  #   - cron: "41 6 * * 1"   # pondelok rano: tyzdenny lievik (cita ho tyzdenna kontrola)

permissions:
  contents: read

env:
  # Planovany beh = GitHub cron ALEBO externy planovac (workflow_dispatch s planovane=true)
  UDALOST: ${{ (github.event_name == 'schedule' || inputs.planovane) && 'schedule' || github.event_name }}

jobs:
  prehlad:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - name: Prehlad
        working-directory: pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python prehlad_navstev.py
