name: Pripomienka obnovy predplatneho

# 7 dni pred koncom zaplateneho obdobia posle vlastnikovi firmy e-mail
# s odkazom na platbu (Stripe je jednorazova platba, ziadna automaticka
# obnova). Skript: pipeline/posli_pripomienku_obnovy.py, RPC z migracie 68.
# PRED PUSHOM musi byt v Supabase spustena migracia 68_plany_a_pristup.sql.

on:
  workflow_dispatch:
    inputs:
      nasucho:
        description: "Nasucho — nic neposielat, len vypisat"
        type: boolean
        default: true
  schedule:
    - cron: "17 6 * * *"

permissions:
  contents: read

concurrency:
  group: pripomienka-obnovy
  cancel-in-progress: false

jobs:
  posli:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - run: pip install -r pipeline/requirements.txt

      - name: Poslat pripomienky obnovy
        working-directory: pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EVENT: ${{ github.event_name }}
          NASUCHO: ${{ inputs.nasucho }}
        run: |
          set -euo pipefail
          ARGS=()
          if [ "$EVENT" = "workflow_dispatch" ] && [ "$NASUCHO" = "true" ]; then
            ARGS+=(--nasucho)
          fi
          echo "Spustam: python posli_pripomienku_obnovy.py ${ARGS[*]-}"
          python posli_pripomienku_obnovy.py "${ARGS[@]}"
