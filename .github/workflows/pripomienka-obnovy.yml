name: Pripomienka obnovy predplatneho

# 7 dni pred koncom zaplateneho obdobia posle vlastnikovi firmy e-mail
# s odkazom na platbu (Stripe je jednorazova platba, ziadna automaticka
# obnova). Skript: pipeline/posli_pripomienku_obnovy.py, RPC z migracie 68.
# PRED PUSHOM musi byt v Supabase spustena migracia 68_plany_a_pristup.sql.

on:
  workflow_dispatch:
    inputs:
      planovane:
        description: "Planovany beh (spusta externy planovac namiesto GitHub cronu)"
        type: boolean
        default: false
      nasucho:
        description: "Nasucho — nic neposielat, len vypisat"
        type: boolean
        default: true
  # Planovanie: Cloudflare Worker predtendrom-planovac (cloudflare/planovac/worker.js),
  # GitHub cron meskal 7-9 hodin. Povodne casy (UTC):
  #   - cron: "17 6 * * *"

permissions:
  contents: read

concurrency:
  group: pripomienka-obnovy
  cancel-in-progress: false

env:
  # Planovany beh = GitHub cron ALEBO externy planovac (workflow_dispatch s planovane=true)
  UDALOST: ${{ (github.event_name == 'schedule' || inputs.planovane) && 'schedule' || github.event_name }}

jobs:
  posli:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - run: pip install -r pipeline/requirements.txt

      - name: Poslat pripomienky obnovy
        working-directory: pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          EVENT: ${{ env.UDALOST }}
          NASUCHO: ${{ inputs.nasucho }}
        run: |
          set -euo pipefail
          ARGS=()
          if [ "$EVENT" = "workflow_dispatch" ] && [ "$NASUCHO" = "true" ]; then
            ARGS+=(--nasucho)
          fi
          echo "Spustam: python posli_pripomienku_obnovy.py ${ARGS[*]-}"
          python posli_pripomienku_obnovy.py "${ARGS[@]}"
