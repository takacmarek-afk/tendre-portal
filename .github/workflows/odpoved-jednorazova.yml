name: Jednorazova odpoved

# Rucna odpoved na jednu spravu v schranke marek@ (vstup len hash adresy).
on:
  workflow_dispatch:
    inputs:
      hash:
        description: "SHA-256 adresy odosielatela"
        type: string
        required: true
      predmet:
        description: "Zaciatok predmetu spravy"
        type: string
        required: true
      text:
        description: "Kluc textu v odpoved_jednorazova.py"
        type: string
        required: true

permissions:
  contents: read

jobs:
  odpoved:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - working-directory: pipeline
        env:
          ZOHO_SMTP_PASSWORD: ${{ secrets.ZOHO_SMTP_PASSWORD }}
          ZOHO_IMAP_PASSWORD: ${{ secrets.ZOHO_IMAP_PASSWORD }}
          HASH: ${{ inputs.hash }}
          PREDMET: ${{ inputs.predmet }}
          TEXT: ${{ inputs.text }}
        run: python odpoved_jednorazova.py
