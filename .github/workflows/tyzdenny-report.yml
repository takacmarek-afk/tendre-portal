name: Tyzdenny prehlad pre Mareka

# Kazdy pondelok rano e-mail s cislami za tyzden na info@predtendrom.sk
# (pipeline/tyzdenny_report.py). Do logu len suhrnne cisla.
on:
  schedule:
    - cron: "37 6 * * 1"   # pondelok ~7:37 SEC
  workflow_dispatch:
    inputs:
      nasucho:
        description: "Nasucho — len vypisat, neposlat"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - name: Prehlad
        working-directory: pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ZOHO_SMTP_PASSWORD: ${{ secrets.ZOHO_SMTP_PASSWORD }}
          NASUCHO: ${{ inputs.nasucho }}
        run: |
          if [ "$NASUCHO" = "true" ]; then python tyzdenny_report.py --nasucho; else python tyzdenny_report.py; fi
