name: Tyzdenny prehlad pre Mareka

# Kazdy pondelok rano e-mail s cislami za tyzden na info@predtendrom.sk
# (pipeline/tyzdenny_report.py). Do logu len suhrnne cisla.
on:
  # Planovanie: Cloudflare Worker predtendrom-planovac (cloudflare/planovac/worker.js),
  # GitHub cron meskal 7-9 hodin. Povodne casy (UTC):
  #   - cron: "37 6 * * 1"   # pondelok ~7:37 SEC
  workflow_dispatch:
    inputs:
      planovane:
        description: "Planovany beh (spusta externy planovac namiesto GitHub cronu)"
        type: boolean
        default: false
      nasucho:
        description: "Nasucho — len vypisat, neposlat"
        type: boolean
        default: false

permissions:
  contents: read

env:
  # Planovany beh = GitHub cron ALEBO externy planovac (workflow_dispatch s planovane=true)
  UDALOST: ${{ (github.event_name == 'schedule' || inputs.planovane) && 'schedule' || github.event_name }}

jobs:
  report:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - name: Prehlad
        working-directory: pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ZOHO_SMTP_PASSWORD: ${{ secrets.ZOHO_SMTP_PASSWORD }}
          NASUCHO: ${{ inputs.nasucho }}
        run: |
          if [ "$NASUCHO" = "true" ]; then python tyzdenny_report.py --nasucho; else python tyzdenny_report.py; fi
