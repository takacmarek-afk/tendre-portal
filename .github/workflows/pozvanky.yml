name: Team pozvanky

# ══════════════════════════════════════════════════════════════════════════
#  STAV: PRIPRAVENE, ESTE NEZAPNUTE NAOSTRO — pred prvym ostrym behom over
#  workflow_dispatch s nasucho=true, ci sa cakajuce pozvanky spravne najdu
#  a HTML vyzera dobre (pozri log kroku), potom teda odkomentuj `schedule:`.
#
#  CO TOTO ROBI
#  Owner v app.html zavola RPC pozvi_clena(email) (Team panel), ktora
#  zapise riadok do invitations (stav='cakajuca', sent_at=null). Tento
#  beh kazdych ~15 minut najde take riadky a posle e-mail s odkazom na
#  prihlasenie.html?pozvanka=<token> cez Resend (pipeline/posli_pozvanky.py).
#
#  PRED PRVYM SPUSTENIM NAOSTRO
#  1. RESEND_API_KEY uz je v Secrets (pouziva ho aj Email workflow).
#  2. Test: workflow_dispatch s nasucho=true — over v logu pocet najdenych
#     pozvaniek a nahlad HTML, potom nasucho=false na realny test (poslat
#     si pozvanku sam sebe cez Team panel v app.html).
#  3. Az potom odkomentuj `schedule:` nizsie.
# ══════════════════════════════════════════════════════════════════════════

on:
  workflow_dispatch:
    inputs:
      nasucho:
        description: "Nasucho — nic neposielat, len vypisat (nechaj true, kym si neistý)"
        type: boolean
        default: true

  # Kazdych 15 minut. Pozvanky nie su casovo kriticke ako denny digest,
  # ale owner ocakava, ze kolega dostane pozvanku v ramci minut, nie hodin.
  # schedule:
  #   - cron: "*/15 * * * *"

permissions:
  contents: read

concurrency:
  group: pozvanky
  cancel-in-progress: false

jobs:
  posli:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt

      - run: pip install -r pipeline/requirements.txt

      - name: Poslat cakajuce team pozvanky
        working-directory: pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          # Rovnaky dovod ako v email.yml: vstup ide cez premennu
          # prostredia, nie priamo interpolovany do shell prikazu.
          EVENT: ${{ github.event_name }}
          NASUCHO: ${{ inputs.nasucho }}
        run: |
          set -euo pipefail
          ARGS=()
          if [ "$EVENT" = "workflow_dispatch" ] && [ "$NASUCHO" = "true" ]; then
            ARGS+=(--nasucho)
          fi
          echo "Spustam: python posli_pozvanky.py ${ARGS[*]-}"
          python posli_pozvanky.py "${ARGS[@]}"
