name: ITMS obstaravania

# Dopocita sektor a kraj obstaravaniam z eurofondov (itms_vo, migracia 97).
# Samotne data stahuje prehliadac na pocitaci v SR (API pusta len SK adresy).
on:
  schedule:
    - cron: "31 5 * * *"
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  itms:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - name: Klasifikacia
        working-directory: pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python itms_klasifikuj.py
