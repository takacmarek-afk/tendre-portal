name: ITMS obstaravania

# Dopocita sektor a kraj obstaravaniam z eurofondov (itms_vo, migracia 97).
# Samotne data stahuje prehliadac na pocitaci v SR (API pusta len SK adresy).
on:
  schedule:
    - cron: "31 5 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: commit-main
  cancel-in-progress: false

jobs:
  itms:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - name: Klasifikacia
        working-directory: pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python itms_klasifikuj.py
      - name: Ktore pripravovane uz urad vyhlasil (parovanie s Vestnikom)
        working-directory: pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python itms_parovanie.py --zapis
      - name: Upozornenie pouzivatelom (vyhlasene z eurofondov)
        working-directory: pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        # NASUCHO, kym Marek neschvali ostre posielanie
        run: python posli_eurofondy_alert.py --nasucho
      - name: SEO stranky /eurofondy/<odbor>/<kraj>
        working-directory: pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: python generuj_eurofondy_podstranky.py
      - name: Commitnut stranky, ak sa zmenili
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/eurofondy/ public/sitemap-eurofondy.xml public/robots.txt
          if git diff --cached --quiet; then
            echo "Ziadna zmena."
          else
            git commit -m "Automaticky vygenerovane: SEO podstranky eurofondy"
            git pull --rebase origin main
            git push
          fi
