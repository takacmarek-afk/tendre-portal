name: Export sifrovany

# Jednorazovy export z databazy pre Mareka (napr. zoznam obci a kontaktov).
# Repo je verejne: vystup sa NIKDY nevypisuje do logu ani neuklada ako artefakt.
# Zasifruje sa verejnym klucom .github/export-claude.pub (RSA-OAEP + AES-256)
# a ulozi do vetvy export-sifrovane. Rozsifrovat vie len drzitel sukromneho kluca.
on:
  workflow_dispatch:
    inputs:
      skript:
        description: "Export"
        type: choice
        options: [obce_kontakty_export, obec_profil_export]
        default: obce_kontakty_export
      obec:
        description: "Nazov obce (len pre obec_profil_export)"
        type: string
        default: ""

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - name: Export
        working-directory: pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SKRIPT: ${{ inputs.skript }}
          OBEC: ${{ inputs.obec }}
        run: python "$SKRIPT.py" "$RUNNER_TEMP/vystup.json" 2>&1 | grep -v "HTTP Request"
      - name: Zasifrovat a ulozit
        env:
          SKRIPT: ${{ inputs.skript }}
        run: |
          set -euo pipefail
          T="$RUNNER_TEMP"
          openssl rand -out "$T/k.bin" 32
          openssl enc -aes-256-cbc -pbkdf2 -salt -in "$T/vystup.json" -out "$T/data.enc" -pass file:"$T/k.bin"
          openssl pkeyutl -encrypt -pubin -inkey .github/export-claude.pub -pkeyopt rsa_padding_mode:oaep \
            -in "$T/k.bin" -out "$T/k.enc"
          rm -f "$T/vystup.json" "$T/k.bin"
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git fetch origin export-sifrovane || true
          if git rev-parse --verify -q origin/export-sifrovane >/dev/null; then
            git checkout -B export-sifrovane origin/export-sifrovane
          else
            git checkout --orphan export-sifrovane && git rm -rf . -q
          fi
          git clean -fdxq
          mkdir -p "$SKRIPT"
          cp "$T/data.enc" "$T/k.enc" "$SKRIPT/"
          git add "$SKRIPT"
          git commit -qm "Export $SKRIPT (beh $GITHUB_RUN_ID)"
          git push -q origin export-sifrovane
