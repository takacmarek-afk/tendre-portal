name: Odpovede na oslovenie

# pipeline/odpovede.py: roztriedi odpovede v schranke marek@predtendrom.sk
# (nie / auto / nedorucene / rucne). Do logu idu len pocty.
# Ostro 2x denne v pracovne dni (schvalil Marek 10. 11. 2026).
on:
  schedule:
    - cron: "47 7 * * 1-5"    # ~8:47 SEC (zima)
    - cron: "47 13 * * 1-5"   # ~14:47 SEC
  workflow_dispatch:
    inputs:
      planovane:
        description: "Planovany beh (spusta externy planovac namiesto GitHub cronu)"
        type: boolean
        default: false
      ostro:
        description: "Ostro: zapisat stav a poslat zdvorile vety pri jasnom Nie"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: odpovede
  cancel-in-progress: false

env:
  # Planovany beh = GitHub cron ALEBO externy planovac (workflow_dispatch s planovane=true)
  UDALOST: ${{ (github.event_name == 'schedule' || inputs.planovane) && 'schedule' || github.event_name }}

jobs:
  odpovede:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r pipeline/requirements.txt
      - name: Odpovede
        working-directory: pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          ZOHO_SMTP_PASSWORD: ${{ secrets.ZOHO_SMTP_PASSWORD }}
          ZOHO_IMAP_PASSWORD: ${{ secrets.ZOHO_IMAP_PASSWORD }}
        run: python odpovede.py ${{ (env.UDALOST == 'schedule' || inputs.ostro) && '--ostro' || '' }}
